name: Deploy

# Manual, owner-gated deployment (PLAN R10, §14).
#
# THREE PROPERTIES THIS WORKFLOW GUARANTEES
#
# 1. **No pull request can trigger it.** Only `workflow_dispatch` does, so a PR
#    cannot reach production secrets even indirectly. PR CI is a separate workflow
#    that holds no credentials and performs no deployment.
#
# 2. **A human gate stands in front of it.** The job targets the `production`
#    GitHub Environment. If that environment has required reviewers configured,
#    the job will not start until one approves — an unattended push cannot deploy.
#    That configuration is an owner action, not something a workflow file can
#    assert; see docs/operations/deployment.md.
#
# 3. **The migration runs before the Worker.** The schema must exist before a
#    Worker version that writes to it is live, so the order is not incidental.
#
# No secret value is ever echoed. Commands reference bindings by name; the
# resolved D1 identifier is not printed either.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to confirm this is an intentional production deployment"
        required: true
        type: string

# Least privilege: read the repository, and an id-token so the environment's
# protection rules can be evaluated. Nothing here needs write access.
permissions:
  contents: read

# Never cancel a deployment in flight: a half-applied migration is worse than a
# slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Verify the deployment confirmation
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: |
          echo "::error::confirmation input must be exactly 'DEPLOY'."
          echo "This is a deliberate speed bump so a mis-click cannot reach production."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      # The same validation PR CI runs, against the exact commit being deployed.
      - name: Validate
        run: npm run validate

      # Injects the D1 database id from a repository variable into a generated
      # config, so the identifier is never committed and the committed config is
      # never mutated in place. Fails loudly if the variable is unset.
      - name: Resolve deploy configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/resolve-deploy-config.mjs

      # Ordered first, deliberately: the schema must exist before a Worker version
      # that writes to it is live.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply TRAFFIC_DB --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      # Evidence only. Deliberately does not print secret values, and
      # `wrangler secret list` reports names, not values.
      - name: Record deployed secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list --config wrangler.deploy.jsonc
