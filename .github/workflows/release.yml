name: Release deploy (Cron authority)

# SECOND STAGE of the two-stage first deployment (PLAN §14, R10), and the only
# path that enables scheduled ECS mutation authority.
#
# WHY THIS IS SEPARATE FROM PRE-FLIGHT
#
# Cron is the only thing that can start or stop an instance. Enabling it before the
# traffic unit has been checked is uniquely dangerous: if the unit assumption is
# wrong, the system does not fail — it computes a *valid but incorrect* threshold
# decision and acts on it. That is the one failure this design cannot detect by
# itself, which is why the empirical check must happen first.
#
# So RELEASE is a distinct owner action, never a continuation of preflight.
#
# FOUR GATES, ALL FAIL-CLOSED
#
# 1. **The protected `production` environment.** Approval is an owner action in
#    GitHub, not something this file can assert; see docs/operations/deployment.md.
#    An unattended push cannot reach this job.
# 2. **A typed `DEPLOY` confirmation.**
# 3. **A typed `LIVE_READ_ONLY_VERIFIED` confirmation**, which the owner may only
#    supply after checking R2/R3/R4 against the Version URL.
# 4. **An explicit `HTTP_EXPOSURE_MODE`.** There is no default value: how the
#    dashboard is reachable is a deployment decision, not an inferred one. The
#    resolver fails closed when it is absent or unrecognised.
#
# The `production` Environment is the authoritative deployment boundary: it must
# require an owner reviewer, restrict deployment branches/tags to `main`, and hold
# the Cloudflare deployment secrets. The workflow-level ref guard is supplementary
# because workflow code comes from the selected ref.
#
# RELEASE also restores `secrets.required`, which PRE-FLIGHT had to clear because a
# Worker that does not exist yet cannot hold secrets. PRE-FLIGHT and RELEASE both
# check the required names after deployment; a missing secret also fails RELEASE.
#
# Every confirmation is `required` and has no default value, because a boolean with
# a default is a gate that passes when nobody looks at it.
#
# Cron enabled by this workflow: */10 * * * *  (every 10 minutes, UTC)
#
# No secret value is echoed. Commands reference bindings by name; the resolved D1
# identifier is not printed either.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to confirm this is an intentional production release"
        required: true
        type: string
      LIVE_READ_ONLY_VERIFIED:
        description: "Type YES only after R2/R3/R4 were verified via the Version URL and /api/query"
        required: true
        type: string
      HTTP_EXPOSURE_MODE:
        description: "How the dashboard/API is reachable: workers_dev or custom_domain"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    name: Release — migrate and enable Cron
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Guard deployment ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Deployment workflows may run only from refs/heads/main."
          exit 1

      - name: Verify the deployment confirmation
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: |
          echo "::error::confirmation input must be exactly 'DEPLOY'."
          echo "This is a deliberate speed bump so a mis-click cannot reach production."
          exit 1

      - name: Verify the live read-only verification confirmation
        if: ${{ inputs.LIVE_READ_ONLY_VERIFIED != 'YES' }}
        run: |
          echo "::error::LIVE_READ_ONLY_VERIFIED must be exactly 'YES'."
          echo "Enabling Cron before the traffic unit and endpoint were verified can"
          echo "produce a valid but incorrect threshold decision rather than a failure."
          echo "Verify R2/R3/R4 against the Version URL first; see docs/operations/deployment.md."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      # The same validation PR CI runs, against the exact commit being deployed.
      - name: Validate
        run: npm run validate

      # `--mode release` restores `triggers.crons = ["*/10 * * * *"]` and applies the
      # owner's HTTP exposure choice. It fails closed when HTTP_EXPOSURE_MODE is
      # absent, unrecognised, or `custom_domain` without WORKER_CUSTOM_DOMAIN.
      #
      # The application runtime variables are injected from the same resolver
      # boundary PRE-FLIGHT used, with the same inputs, so a change of mode cannot
      # silently change what the Worker is configured to do.
      - name: Resolve release configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          HTTP_EXPOSURE_MODE: ${{ inputs.HTTP_EXPOSURE_MODE }}
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          REGION_ID: ${{ vars.REGION_ID }}
          ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
          TRAFFIC_THRESHOLD_GB: ${{ vars.TRAFFIC_THRESHOLD_GB }}
          CDT_ENDPOINT: ${{ vars.CDT_ENDPOINT }}
          BUSINESS_REGION_ID: ${{ vars.BUSINESS_REGION_ID }}
          SIGNATURE_VERSION: ${{ vars.SIGNATURE_VERSION }}
          STOPPED_MODE: ${{ vars.STOPPED_MODE }}
        run: node scripts/resolve-deploy-config.mjs --mode release

      # Ordered first, deliberately: the schema must exist before a Worker version
      # that writes to it is live.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply TRAFFIC_DB --remote --config wrangler.deploy.jsonc

      # This is the step that enables scheduled mutation authority. The config it
      # uses declares the production Cron expression, so the authority is granted
      # by an explicitly authorized dispatch rather than as a side effect.
      - name: "Deploy release Worker (Cron enabled: */10 * * * *)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      # Check names after deploy as well as relying on `secrets.required`, in case
      # a secret is cleared after config generation. Wrangler reports names only.
      - name: Verify required Worker Secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler secret list --format json --config wrangler.deploy.jsonc | node scripts/assert-worker-secret-names.mjs

      - name: Next step — measure Cron cpuTime
        run: |
          echo "Cron is now enabled every 10 minutes. The first scheduled run must be observed:"
          echo "  - read its cpuTime from Workers observability and record it in"
          echo "    docs/operations/deployment.md (§7, Cloudflare plan requirement);"
          echo "  - confirm the webhook payload matches the expectations established during"
          echo "    preflight verification."
