name: Update deploy (existing Worker, Cron preserved)

# !!! PRE-FLIGHT IS FIRST-DEPLOY ONLY. Never run it against a live Cron Worker:
#     it writes triggers.crons = [] and removes every Cron Trigger.
#
# UPDATE is only for an existing production Worker. The owner must attest that the
# Worker exists and its production Cron is already live. The generated config
# explicitly keeps Cron at */10 * * * * and carries the selected HTTP exposure.
#
# This is separate from RELEASE: RELEASE enables Cron after first-deploy live
# read-only verification; UPDATE maintains an already-running Worker. It does not
# change the Cron-only ECS mutation authority or the application's control logic.
#
# Order is deliberate: validate, resolve the existing-Worker config, apply additive
# D1 migrations, then deploy code that uses the migrated schema. Required Worker
# Secret names are checked after deploy; no secret values are printed.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UPDATE to confirm an intentional production Worker update"
        required: true
        type: string
      EXISTING_WORKER_CONFIRMED:
        description: "Type YES to attest the Worker exists and Cron */10 * * * * is live"
        required: true
        type: string
      HTTP_EXPOSURE_MODE:
        description: "Keep the existing HTTP exposure: workers_dev or custom_domain"
        required: true
        type: choice
        options:
          - workers_dev
          - custom_domain

permissions:
  contents: read

concurrency:
  group: deploy-update
  cancel-in-progress: false

jobs:
  update:
    name: Update — existing Worker, Cron preserved
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Guard deployment ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Deployment workflows may run only from refs/heads/main."
          exit 1

      - name: Verify the update confirmation
        if: ${{ inputs.confirmation != 'UPDATE' }}
        run: |
          echo "::error::confirmation input must be exactly 'UPDATE'."
          exit 1

      - name: Verify the existing Worker and live Cron attestation
        if: ${{ inputs.EXISTING_WORKER_CONFIRMED != 'YES' }}
        run: |
          echo "::error::EXISTING_WORKER_CONFIRMED must be exactly 'YES'."
          echo "UPDATE requires an existing Worker with Cron */10 * * * * already live."
          echo "For a first deployment, use PRE-FLIGHT and then RELEASE after verification."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: npm run validate

      # Fail before any remote migration or deploy if required credentials or
      # application variables are missing. Print names only, never their values.
      - name: Verify deployment credentials and repository variables are visible
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID REGION_ID ECS_INSTANCE_ID; do
            value="$(printenv "$name" || true)"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::$name is empty in this job."
              exit 1
            fi
          done
          if [ "${HTTP_EXPOSURE_MODE}" = "custom_domain" ]; then
            value="$(printenv WORKER_CUSTOM_DOMAIN || true)"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::WORKER_CUSTOM_DOMAIN is required for custom_domain exposure."
              exit 1
            fi
          fi
          echo "Deployment credentials and required repository variables are visible."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          REGION_ID: ${{ vars.REGION_ID }}
          ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
          HTTP_EXPOSURE_MODE: ${{ inputs.HTTP_EXPOSURE_MODE }}
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}

      # The existing-Worker artifact restores the production Cron explicitly,
      # retains secrets.required, and requires the same exposure decision as RELEASE.
      - name: Resolve update configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          HTTP_EXPOSURE_MODE: ${{ inputs.HTTP_EXPOSURE_MODE }}
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          REGION_ID: ${{ vars.REGION_ID }}
          ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
          TRAFFIC_THRESHOLD_GB: ${{ vars.TRAFFIC_THRESHOLD_GB }}
          CDT_ENDPOINT: ${{ vars.CDT_ENDPOINT }}
          BUSINESS_REGION_ID: ${{ vars.BUSINESS_REGION_ID }}
          SIGNATURE_VERSION: ${{ vars.SIGNATURE_VERSION }}
          STOPPED_MODE: ${{ vars.STOPPED_MODE }}
        run: node scripts/resolve-deploy-config.mjs --mode update

      # Additive migrations must be applied before code that reads or writes the
      # added schema, including migration 0002_decision_reason.sql.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply TRAFFIC_DB --remote --config wrangler.update.jsonc

      - name: "Deploy update Worker (Cron preserved: */10 * * * *)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.update.jsonc

      - name: Verify required Worker Secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler secret list --format json --config wrangler.update.jsonc | node scripts/assert-worker-secret-names.mjs

      - name: Next step — observe the update
        run: |
          echo "Confirm Cron remains present at */10 * * * * and review the applied D1 migrations."
          echo "Run the console and health checks for the selected HTTP exposure."
          echo "Cron is already enabled; there is no separate enable-Cron step in UPDATE."
