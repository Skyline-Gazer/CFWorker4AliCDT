# One-shot / rotation helper: install repository secret MONITOR_READ_TOKEN onto
# the existing production Worker using the production Environment Cloudflare
# credentials. Never prints the token or Authorization material.
#
# Does NOT deploy application code. Does NOT run UPDATE/RELEASE/PRE-FLIGHT.
# `wrangler secret put` creates a new Worker version that carries secrets;
# follow with the authorized UPDATE workflow to pin application SHA.

name: Install MONITOR_READ_TOKEN

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSTALL to confirm Worker Secret write
        required: true
        type: string

concurrency:
  group: install-monitor-read-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    name: Put MONITOR_READ_TOKEN on Worker
    if: ${{ inputs.confirmation == 'INSTALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Put Worker secret (stdin; no echo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MONITOR_READ_TOKEN: ${{ secrets.MONITOR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MONITOR_READ_TOKEN:-}" ]; then
            echo "::error::Repository secret MONITOR_READ_TOKEN is missing or empty."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::production Environment Cloudflare credentials are missing."
            exit 1
          fi
          # Pipe secret value; never pass as argv and never print.
          printf '%s' "${MONITOR_READ_TOKEN}" | npx wrangler secret put MONITOR_READ_TOKEN --config wrangler.jsonc
          # Verify name presence only (values are never returned by secret list).
          npx wrangler secret list --format json --config wrangler.jsonc > /tmp/worker-secrets.json
          node -e '
            const fs = require("node:fs");
            const rows = JSON.parse(fs.readFileSync("/tmp/worker-secrets.json", "utf8"));
            const names = rows.map((row) => (typeof row === "string" ? row : row.name)).filter(Boolean).sort();
            if (!names.includes("MONITOR_READ_TOKEN")) {
              console.error("MONITOR_READ_TOKEN missing from wrangler secret list");
              process.exit(1);
            }
            console.log("MONITOR_READ_TOKEN_NAME_PRESENT=YES");
            console.log("WORKER_SECRET_NAMES=" + names.join(","));
          '
